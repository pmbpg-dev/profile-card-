<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PMBPG | Profile Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #eeedf9;
        --bg2: #d9d6f5;
        --card: rgba(255, 255, 255, 0.62);
        --line: rgba(40, 30, 120, 0.14);
        --text: #1a1740;
        --muted: #5d5a86;
        --a: #5b3df5;
        --b: #ff5c8a;
        --c: #19c3b1;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d0b22;
          --bg2: #1a1547;
          --card: rgba(28, 24, 72, 0.55);
          --line: rgba(190, 180, 255, 0.16);
          --text: #f1efff;
          --muted: #a9a5d6;
          --a: #8b78ff;
          --b: #ff6f9c;
          --c: #3be0cc;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d0b22;
        --bg2: #1a1547;
        --card: rgba(28, 24, 72, 0.55);
        --line: rgba(190, 180, 255, 0.16);
        --text: #f1efff;
        --muted: #a9a5d6;
        --a: #8b78ff;
        --b: #ff6f9c;
        --c: #3be0cc;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--bg);
        overflow-x: hidden;
        position: relative;
      }
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.55;
        z-index: 0;
        pointer-events: none;
      }
      .b1 {
        width: 360px;
        height: 360px;
        background: var(--a);
        top: -100px;
        right: -80px;
      }
      .b2 {
        width: 320px;
        height: 320px;
        background: var(--b);
        bottom: -90px;
        left: -70px;
      }
      .b3 {
        width: 220px;
        height: 220px;
        background: var(--c);
        top: 45%;
        left: 35%;
        opacity: 0.3;
      }
      .theme {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top, 0px));
        right: 16px;
        z-index: 5;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        font-size: 20px;
        cursor: pointer;
        backdrop-filter: blur(10px);
      }
      .stage {
        position: relative;
        z-index: 1;
        perspective: 1000px;
        width: 100%;
        max-width: 400px;
      }
      .card {
        position: relative;
        padding: 32px 28px 26px;
        border-radius: 32px;
        border: 1px solid var(--line);
        background: var(--card);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        transform-style: preserve-3d;
        transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
        transition: transform 0.25s ease-out;
        box-shadow: 0 30px 60px -20px rgba(60, 30, 180, 0.35);
        overflow: hidden;
        text-align: center;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          420px circle at var(--mx, 50%) var(--my, 0%),
          rgba(255, 255, 255, 0.35),
          transparent 60%
        );
        mix-blend-mode: soft-light;
      }
      .avatar {
        width: 112px;
        height: 112px;
        margin: 0 auto 18px;
        border-radius: 50%;
        padding: 4px;
        background: conic-gradient(
          from 200deg,
          var(--a),
          var(--b),
          var(--c),
          var(--a)
        );
        transform: translateZ(40px);
        animation: spin 14s linear infinite;
      }
      .avatar span {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--bg);
        font-weight: 800;
        font-size: 34px;
        letter-spacing: 1px;
        animation: spin 14s linear infinite reverse;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 26px;
        font-weight: 800;
        transform: translateZ(30px);
      }
      .role {
        margin-top: 6px;
        font-weight: 600;
        color: var(--a);
        font-size: 15px;
      }
      .loc {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }
      .bio {
        margin: 18px auto 22px;
        max-width: 30ch;
        line-height: 1.9;
        color: var(--muted);
        font-size: 14px;
      }
      .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin: 20px 0;
      }
      .skills li {
        list-style: none;
        padding: 6px 14px;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.08);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 14px 0;
        border-block: 1px solid var(--line);
      }
      .stats b {
        display: block;
        font-size: 20px;
      }
      .stats small {
        color: var(--muted);
        font-size: 12px;
      }
      .socials {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 18px;
        transform: translateZ(20px);
      }
      .ig {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border-radius: 16px;
        text-decoration: none;
        text-align: left;
        color: var(--text);
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.08);
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .ig svg {
        flex: none;
        padding: 8px;
        box-sizing: content-box;
        width: 22px;
        height: 22px;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(45deg, #f9a03c, #ee2a7b 55%, #6228d7);
      }
      .ig span {
        display: grid;
        line-height: 1.4;
        min-width: 0;
      }
      .ig b {
        font-size: 13px;
      }
      .ig small {
        color: var(--muted);
        font-size: 12px;
      }
      .ig:hover {
        transform: translateY(-2px);
        border-color: var(--b);
      }
      .ig:focus-visible {
        outline: 3px solid var(--c);
        outline-offset: 3px;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-top: 20px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 16px;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid var(--line);
        color: var(--text);
        background: transparent;
      }
      .btn.main {
        border: 0;
        color: #fff;
        background: linear-gradient(135deg, var(--a), var(--b));
        box-shadow: 0 10px 24px -8px var(--a);
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:focus-visible,
      .theme:focus-visible {
        outline: 3px solid var(--c);
        outline-offset: 3px;
      }
      .toast {
        position: fixed;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translate(-50%, 20px);
        opacity: 0;
        padding: 10px 18px;
        border-radius: 12px;
        background: var(--text);
        color: var(--bg);
        font-size: 14px;
        transition: 0.3s;
        z-index: 9;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <button class="theme" id="theme" aria-label="Toggle theme">🌓</button>

    <main class="stage">
      <article class="card" id="card">
        <div class="avatar"><span>PMB</span></div>
        <h1>Pourya Moradi Biameh</h1>
        <p class="role">Front-End Developer &amp; Athlete</p>
        <p class="loc">Saveh, Iran</p>
        <p class="bio">
          I love hard challenges. The tougher the problem, the more I enjoy
          solving it.
        </p>
        <div class="stats">
          <div><b>∞</b><small>Curiosity</small></div>
          <div><b>24/7</b><small>Learning</small></div>
          <div><b>100%</b><small>Drive</small></div>
        </div>
        <div class="socials">
          <a
            class="ig"
            href="https://instagram.com/pmbpk"
            target="_blank"
            rel="noopener"
          >
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
            </svg>
            <span><b>Main page</b><small>@pmbpk</small></span>
          </a>
          <a
            class="ig"
            href="https://instagram.com/pmbpg"
            target="_blank"
            rel="noopener"
          >
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
            </svg>
            <span><b>Front-end page</b><small>@pmbpg</small></span>
          </a>
          <a
            class="ig"
            href="https://instagram.com/amata.calisthenics"
            target="_blank"
            rel="noopener"
          >
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
            </svg>
            <span><b>Athletics team</b><small>@amata.calisthenics</small></span>
          </a>
        </div>
        <div class="actions">
          <a
            class="btn main"
            href="https://github.com/pmbpg-dev"
            target="_blank"
            rel="noopener"
            >View GitHub</a
          >
          <button class="btn" id="copy" aria-label="Copy GitHub link">
            📋
          </button>
        </div>
      </article>
    </main>
    <div class="toast" id="toast" role="status">Link copied</div>

    <script>
      const card = document.getElementById("card"),
        stage = card.parentElement;
      stage.addEventListener("pointermove", (e) => {
        if (e.pointerType === "touch") return;
        const r = card.getBoundingClientRect(),
          x = (e.clientX - r.left) / r.width,
          y = (e.clientY - r.top) / r.height;
        card.style.setProperty("--ry", (x - 0.5) * 14 + "deg");
        card.style.setProperty("--rx", (0.5 - y) * 14 + "deg");
        card.style.setProperty("--mx", x * 100 + "%");
        card.style.setProperty("--my", y * 100 + "%");
      });
      stage.addEventListener("pointerleave", () => {
        card.style.setProperty("--rx", "0deg");
        card.style.setProperty("--ry", "0deg");
      });

      const toast = document.getElementById("toast");
      function show(t) {
        toast.textContent = t;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1800);
      }
      document.getElementById("copy").onclick = async () => {
        try {
          await navigator.clipboard.writeText("https://github.com/pmbpg-dev");
          show("Link copied");
        } catch (e) {
          show("Copy failed. Please copy the link manually");
        }
      };

      const root = document.documentElement;
      try {
        const s = localStorage.getItem("theme");
        if (s) root.dataset.theme = s;
      } catch (e) {}
      document.getElementById("theme").onclick = () => {
        const dark = root.dataset.theme
          ? root.dataset.theme === "dark"
          : matchMedia("(prefers-color-scheme:dark)").matches;
        root.dataset.theme = dark ? "light" : "dark";
        try {
          localStorage.setItem("theme", root.dataset.theme);
        } catch (e) {}
      };
    </script>
  </body>
</html>
